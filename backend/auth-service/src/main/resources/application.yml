server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET}
  expiry-hours: 24

owner:
  seed:
    username: ${OWNER_USERNAME:manhnpc}
    password: ${OWNER_PASSWORD}
    display-name: ${OWNER_DISPLAY_NAME:Nguyễn Đình Khánh}
