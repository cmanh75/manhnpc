services:
  app:
    container_name: portfolio-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://manhnpc.com,https://www.manhnpc.com
      OWNER_USERNAME: ${OWNER_USERNAME:-manhnpc}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/appdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    volumes:
      - app_data:/app/data
    networks:
      - portfolio
      - english_proxy
    # ffmpeg transcoding needs real headroom alongside the JVM heap (70% of this limit)
    mem_limit: 1024m

networks:
  portfolio:
  english_proxy:
    external: true
    name: english-supporter-backend_default

volumes:
  app_data:
