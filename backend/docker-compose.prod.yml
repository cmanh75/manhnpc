x-service: &service
  restart: unless-stopped
  environment: &common-env
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    JWT_SECRET: ${JWT_SECRET}
  networks:
    - portfolio

x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  discovery-server:
    <<: *service
    container_name: portfolio-discovery
    build:
      <<: *build
      args:
        SERVICE: discovery-server
    mem_limit: 256m

  auth-service:
    <<: *service
    container_name: portfolio-auth
    build:
      <<: *build
      args:
        SERVICE: auth-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      OWNER_USERNAME: ${OWNER_USERNAME:-manhnpc}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      OWNER_DISPLAY_NAME: ${OWNER_DISPLAY_NAME:-Manh NPC}
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/authdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    volumes:
      - auth_data:/app/data
    mem_limit: 320m

  content-service:
    <<: *service
    container_name: portfolio-content
    build:
      <<: *build
      args:
        SERVICE: content-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/contentdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    volumes:
      - content_data:/app/data
    mem_limit: 320m

  media-service:
    <<: *service
    container_name: portfolio-media
    build:
      <<: *build
      args:
        SERVICE: media-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/mediadb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
      MEDIA_UPLOAD_DIR: /app/uploads
    volumes:
      - media_data:/app/data
      - media_uploads:/app/uploads
    mem_limit: 384m

  travel-service:
    <<: *service
    container_name: portfolio-travel
    build:
      <<: *build
      args:
        SERVICE: travel-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/traveldb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    volumes:
      - travel_data:/app/data
    mem_limit: 320m

  guestbook-service:
    <<: *service
    container_name: portfolio-guestbook
    build:
      <<: *build
      args:
        SERVICE: guestbook-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/guestbookdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    volumes:
      - guestbook_data:/app/data
    mem_limit: 320m

  journal-service:
    <<: *service
    container_name: portfolio-journal
    build:
      <<: *build
      args:
        SERVICE: journal-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/journaldb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    volumes:
      - journal_data:/app/data
    mem_limit: 320m

  api-gateway:
    <<: *service
    container_name: portfolio-api-gateway
    build:
      <<: *build
      args:
        SERVICE: api-gateway
    depends_on:
      - discovery-server
      - auth-service
      - content-service
      - media-service
      - travel-service
      - guestbook-service
      - journal-service
    environment:
      <<: *common-env
      CORS_ALLOWED_ORIGINS: https://manhnpc.com,https://www.manhnpc.com
    networks:
      - portfolio
      - english_proxy
    mem_limit: 384m

networks:
  portfolio:
  english_proxy:
    external: true
    name: english-supporter-backend_default

volumes:
  auth_data:
  content_data:
  media_data:
  media_uploads:
  travel_data:
  guestbook_data:
  journal_data:
