server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: profile-route
          uri: lb://auth-service
          predicates:
            - Path=/api/profile/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/posts/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
        - id: travel-service
          uri: lb://travel-service
          predicates:
            - Path=/api/travel/**
        - id: guestbook-service
          uri: lb://guestbook-service
          predicates:
            - Path=/api/guestbook/**

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
