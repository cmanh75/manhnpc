server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: profile-route
          uri: lb://auth-service
          predicates:
            - Path=/api/profile/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/posts/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
        - id: travel-service
          uri: lb://travel-service
          predicates:
            - Path=/api/travel/**
        - id: guestbook-service
          uri: lb://guestbook-service
          predicates:
            - Path=/api/guestbook/**
        - id: journal-service
          uri: lb://journal-service
          predicates:
            - Path=/api/journal/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit/**

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
