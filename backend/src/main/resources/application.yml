server:
  port: 8090

spring:
  application:
    name: manhnpc-backend
  datasource:
    url: jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      # per-file / whole-batch ceilings — a "New post" upload bundles several
      # raw phone videos in one multipart request, so max-request-size has to
      # cover the sum of all files, not just one
      max-file-size: 300MB
      max-request-size: 500MB

jwt:
  secret: ${JWT_SECRET}
  expiry-hours: 24

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

owner:
  seed:
    username: ${OWNER_USERNAME:manhnpc}
    password: ${OWNER_PASSWORD}

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  public-base-url: ${R2_PUBLIC_BASE_URL:}

geoip:
  # free at maxmind.com/en/geolite2/signup — leave blank to disable country/city lookups on visit logs
  license-key: ${GEOIP_LICENSE_KEY:}
  database-path: ${GEOIP_DATABASE_PATH:./data/GeoLite2-City.mmdb}

openai:
  # leave blank to disable the journal AI-report feature locally
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeout-ms: ${OPENAI_TIMEOUT_MS:30000}
