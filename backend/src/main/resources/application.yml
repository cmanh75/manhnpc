server:
  port: 8090

spring:
  application:
    name: manhnpc-backend
  datasource:
    url: jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  expiry-hours: 24

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

owner:
  seed:
    username: ${OWNER_USERNAME:manhnpc}
    password: ${OWNER_PASSWORD}

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  public-base-url: ${R2_PUBLIC_BASE_URL:}
