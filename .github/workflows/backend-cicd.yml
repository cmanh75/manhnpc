name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile backend
        run: mvn -B -DskipTests compile

      - name: Validate production Compose
        env:
          JWT_SECRET: ci-placeholder-at-least-32-characters
          OWNER_PASSWORD: ci-placeholder
          R2_ACCOUNT_ID: ci-placeholder
          R2_ACCESS_KEY_ID: ci-placeholder
          R2_SECRET_ACCESS_KEY: ci-placeholder
          R2_BUCKET: ci-placeholder
          R2_PUBLIC_BASE_URL: https://ci-placeholder.example.com
          GEOIP_LICENSE_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
        run: docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean remote backend source
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: rm -rf /opt/manhnpc/backend/src /opt/manhnpc/backend/pom.xml

      - name: Upload backend source
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend"
          target: "/opt/manhnpc"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GEOIP_LICENSE_KEY: ${{ secrets.GEOIP_LICENSE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: JWT_SECRET,OWNER_PASSWORD,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,R2_PUBLIC_BASE_URL,GEOIP_LICENSE_KEY,OPENAI_API_KEY
          command_timeout: 20m
          script: |
            set -eu

            REPO=/opt/manhnpc
            BACKEND="$REPO/backend"
            CADDY_REPO=/root/english-supporter-backend

            umask 077
            {
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'OWNER_PASSWORD=%s\n' "$OWNER_PASSWORD"
              printf 'OWNER_USERNAME=manhnpc\n'
              printf 'R2_ACCOUNT_ID=%s\n' "$R2_ACCOUNT_ID"
              printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
              printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
              printf 'R2_BUCKET=%s\n' "$R2_BUCKET"
              printf 'R2_PUBLIC_BASE_URL=%s\n' "$R2_PUBLIC_BASE_URL"
              printf 'GEOIP_LICENSE_KEY=%s\n' "$GEOIP_LICENSE_KEY"
              printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            } > "$BACKEND/.env"

            docker network inspect english-supporter-backend_default >/dev/null

            cd "$BACKEND"
            # --remove-orphans also tears down the old per-service fleet's containers
            # (discovery/gateway/auth/etc.) now that they're no longer in this compose
            # file, without touching their data volumes
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # ensure the Caddyfile's reverse_proxy target points at the new single
            # container, replacing any stale target left over from the old gateway
            if grep -q '^portfolio-api\.manhnpc\.com {' "$CADDY_REPO/Caddyfile"; then
              sed -i '/^portfolio-api\.manhnpc\.com {/,/^}/ s#reverse_proxy .*#reverse_proxy portfolio-app:8090#' \
                "$CADDY_REPO/Caddyfile"
            else
              {
                printf '\nportfolio-api.manhnpc.com {\n'
                printf '    reverse_proxy portfolio-app:8090\n'
                printf '}\n'
              } >> "$CADDY_REPO/Caddyfile"
            fi

            cd "$CADDY_REPO"
            # `caddy reload` has been observed to keep an old upstream target live even
            # after the Caddyfile on disk changed (a soft reload can end up comparing
            # against a stale in-memory config and no-op). A full container restart
            # reliably re-reads the file from scratch.
            docker compose -f docker-compose.prod.yml restart caddy

            sleep 20
            docker compose -f "$BACKEND/docker-compose.prod.yml" ps

            echo "--- app logs (last 150 lines) ---"
            docker compose -f "$BACKEND/docker-compose.prod.yml" logs app --tail 150 || true

            unset JWT_SECRET OWNER_PASSWORD R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL GEOIP_LICENSE_KEY OPENAI_API_KEY
