name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile backend
        run: mvn -B -DskipTests compile

      - name: Validate production Compose
        env:
          JWT_SECRET: ci-placeholder-at-least-32-characters
          OWNER_PASSWORD: ci-placeholder
          R2_ACCOUNT_ID: ci-placeholder
          R2_ACCESS_KEY_ID: ci-placeholder
          R2_SECRET_ACCESS_KEY: ci-placeholder
          R2_BUCKET: ci-placeholder
          R2_PUBLIC_BASE_URL: https://ci-placeholder.example.com
        run: docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload backend source
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend"
          target: "/opt/manhnpc"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: JWT_SECRET,OWNER_PASSWORD,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,R2_PUBLIC_BASE_URL
          command_timeout: 20m
          script: |
            set -eu

            REPO=/opt/manhnpc
            BACKEND="$REPO/backend"
            CADDY_REPO=/root/english-supporter-backend

            umask 077
            {
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'OWNER_PASSWORD=%s\n' "$OWNER_PASSWORD"
              printf 'OWNER_USERNAME=manhnpc\n'
              printf 'OWNER_DISPLAY_NAME=Manh NPC\n'
              printf 'R2_ACCOUNT_ID=%s\n' "$R2_ACCOUNT_ID"
              printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
              printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
              printf 'R2_BUCKET=%s\n' "$R2_BUCKET"
              printf 'R2_PUBLIC_BASE_URL=%s\n' "$R2_PUBLIC_BASE_URL"
            } > "$BACKEND/.env"

            docker network inspect english-supporter-backend_default >/dev/null

            cd "$BACKEND"
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            if ! grep -q '^portfolio-api\.manhnpc\.com {' "$CADDY_REPO/Caddyfile"; then
              {
                printf '\nportfolio-api.manhnpc.com {\n'
                printf '    reverse_proxy portfolio-api-gateway:8090\n'
                printf '}\n'
              } >> "$CADDY_REPO/Caddyfile"
            fi

            cd "$CADDY_REPO"
            docker compose -f docker-compose.prod.yml exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile

            sleep 20
            docker compose -f "$BACKEND/docker-compose.prod.yml" ps

            echo "--- media-service logs (last 150 lines) ---"
            docker compose -f "$BACKEND/docker-compose.prod.yml" logs media-service --tail 150 || true

            unset JWT_SECRET OWNER_PASSWORD R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL
